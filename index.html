<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6つのMoneyタイプ診断</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card" id="start-screen">
      <p class="eyebrow">MONEY TYPE CHECK</p>
      <h1>6つのMoneyタイプ診断</h1>
      <p class="lead">18の質問に答えると、あなたのお金との付き合い方が分かります。</p>
      <div class="type-grid">
        <span>💰 投資家</span><span>🏦 貯蓄家</span><span>🎯 計画家</span>
        <span>🎉 エンジョイ</span><span>⚡ チャレンジャー</span><span>💎 バランス</span>
      </div>
      <button id="start-btn">診断をはじめる</button>
    </section>

    <section class="card hidden" id="quiz-screen">
      <div class="progress-row">
        <span id="progress-text"></span>
        <div class="progress"><div id="progress-bar"></div></div>
      </div>
      <h2 id="question-text"></h2>
      <div id="choices" class="choices"></div>
      <button class="secondary" id="back-btn">前の質問へ</button>
    </section>

    <section class="card hidden" id="result-screen">
      <p class="eyebrow">YOUR MONEY TYPE</p>
      <div id="result-icon" class="result-icon"></div>
      <h2 id="result-title"></h2>
      <p id="result-summary" class="lead"></p>
      <div id="score-list" class="score-list"></div>
      <div class="result-box">
        <h3>あなたへのアドバイス</h3>
        <p id="result-advice"></p>
      </div>
      <button id="retry-btn">もう一度診断する</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
